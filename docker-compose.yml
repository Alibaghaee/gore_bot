services:
  app:
    build:
      context: .
      dockerfile: deployments/Dockerfile.dev
    container_name: telebridge_app
    volumes:
      - .:/app
    ports:
      - "8090:8080"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: telebridge_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: telebridge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: telebridge_rabbit
    ports:
      - "0.0.0.0:5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - telegram_bridge_network


networks:
  telegram_bridge_network:
    driver: bridge
    external: true